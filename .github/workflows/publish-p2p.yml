name: Publish p2p

# Publishes a library of packages/ to GitHub's npm registry: @fionapreroll/p2p or
# @fionapreroll/p2p-nearby, in one of two ways:
# - Run workflow (Actions tab, on main), choosing the package: publishes the version in its
#   package.json, then tags the commit p2p-vX.Y.Z or p2p-nearby-vX.Y.Z.
# - Pushing such a tag: publishes that package's version; the tag must match its package.json.

on:
  push:
    tags: ["p2p-v*", "p2p-nearby-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Which library to publish
        type: choice
        options: [p2p, p2p-nearby]
        default: p2p

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-p2p
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@fionapreroll"
      - run: pnpm install --frozen-lockfile
      - name: Check the version
        id: version
        env:
          CHOSEN: ${{ inputs.package }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF_NAME" in
              p2p-nearby-v*) package=p2p-nearby ;;
              *) package=p2p ;;
            esac
          else
            package="$CHOSEN"
          fi
          dir="packages/$package"
          version=$(node -p "require('./$dir/package.json').version")
          tag="$package-v$version"
          {
            echo "package=$package"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $dir/package.json ($version)"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Publish from main only, not $GITHUB_REF"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag exists already: raise the version in $dir/package.json first"
              exit 1
            fi
          fi
          if ! grep -q "^## \[$version\] - " "$dir/CHANGELOG.md"; then
            echo "::error::$dir/CHANGELOG.md has no section for $version"
            exit 1
          fi
      - run: pnpm check
      - run: pnpm --filter "@fionapreroll/${{ steps.version.outputs.package }}" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only once the package is out, so a failed run leaves no tag behind and can be run again.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "@fionapreroll/$PACKAGE $VERSION"
          git push origin "$TAG"
