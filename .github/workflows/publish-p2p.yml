name: Publish p2p

# Publishes a library of packages/ to GitHub's npm registry: @fionapreroll/p2p,
# @fionapreroll/p2p-nearby or @fionapreroll/app-updates, in one of two ways:
# - Run workflow (Actions tab, on main), choosing the package: publishes the version in its
#   package.json, then tags the commit p2p-vX.Y.Z, p2p-nearby-vX.Y.Z or app-updates-vX.Y.Z.
# - Pushing such a tag: publishes that package's version; the tag must match its package.json.

on:
  push:
    tags: ["p2p-v*", "p2p-nearby-v*", "app-updates-v*"]
  workflow_dispatch:
    inputs:
      package:
        description: Which library to publish
        type: choice
        options: [p2p, p2p-nearby, app-updates]
        default: p2p

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-p2p
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@fionapreroll"
      - run: pnpm install --frozen-lockfile
      - name: Check the version
        id: version
        env:
          CHOSEN: ${{ inputs.package }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            case "$GITHUB_REF_NAME" in
              p2p-nearby-v*) package=p2p-nearby ;;
              app-updates-v*) package=app-updates ;;
              *) package=p2p ;;
            esac
          else
            package="$CHOSEN"
          fi
          dir="packages/$package"
          version=$(node -p "require('./$dir/package.json').version")
          tag="$package-v$version"
          {
            echo "package=$package"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match $dir/package.json ($version)"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Publish from main only, not $GITHUB_REF"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag exists already: raise the version in $dir/package.json first"
              exit 1
            fi
          fi
          if ! grep -q "^## \[$version\] - " "$dir/CHANGELOG.md"; then
            echo "::error::$dir/CHANGELOG.md has no section for $version"
            exit 1
          fi
      - run: pnpm check
      - run: pnpm --filter "@fionapreroll/${{ steps.version.outputs.package }}" publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only once the package is out, so a failed run leaves no tag behind and can be run again.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "@fionapreroll/$PACKAGE $VERSION"
          git push origin "$TAG"
      # The package as a file on a release of its own, which anyone can install without logging
      # in to GitHub's registry: pnpm add https://github.com/…/releases/download/<tag>/<file>.
      # It is never marked latest, which stays the Android app's release.
      - name: Attach the package to a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PACKAGE: ${{ steps.version.outputs.package }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          (cd "packages/$PACKAGE" && pnpm pack --pack-destination "$RUNNER_TEMP")
          file="$RUNNER_TEMP/fionapreroll-$PACKAGE-$VERSION.tgz"
          test -f "$file"
          awk -v heading="## [$VERSION] - " '
            index($0, heading) == 1 { on = 1; next }
            on && (/^## / || /^\[/) { exit }
            on { print }
          ' "packages/$PACKAGE/CHANGELOG.md" > changes.md
          {
            echo "\`@fionapreroll/$PACKAGE\` $VERSION, also on [GitHub's npm registry](https://github.com/FionaPreroll/vibe-p2pgame/pkgs/npm/$PACKAGE). To install it without logging in:"
            echo
            echo '```bash'
            echo "pnpm add https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/fionapreroll-$PACKAGE-$VERSION.tgz"
            echo '```'
            cat changes.md
          } > notes.md
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$file" --clobber
          else
            gh release create "$TAG" "$file" --verify-tag --title "@fionapreroll/$PACKAGE $VERSION" --notes-file notes.md --latest=false
          fi
