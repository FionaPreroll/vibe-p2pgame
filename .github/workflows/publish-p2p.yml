name: Publish p2p

# Publishes @fionapreroll/p2p to GitHub's npm registry, in one of two ways:
# - Run workflow (Actions tab, on main): publishes the version in packages/p2p/package.json,
#   then tags the commit p2p-vX.Y.Z.
# - Pushing a tag p2p-vX.Y.Z: publishes that version; the tag must match package.json.

on:
  push:
    tags: ["p2p-v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-p2p
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@fionapreroll"
      - run: pnpm install --frozen-lockfile
      - name: Check the version
        id: version
        run: |
          version=$(node -p "require('./packages/p2p/package.json').version")
          tag="p2p-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match packages/p2p/package.json ($version)"
              exit 1
            fi
          else
            if [ "$GITHUB_REF" != refs/heads/main ]; then
              echo "::error::Publish from main only, not $GITHUB_REF"
              exit 1
            fi
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag exists already: raise the version in packages/p2p/package.json first"
              exit 1
            fi
          fi
          if ! grep -q "^## \[$version\] - " packages/p2p/CHANGELOG.md; then
            echo "::error::packages/p2p/CHANGELOG.md has no section for $version"
            exit 1
          fi
      - run: pnpm check
      - run: pnpm --filter @fionapreroll/p2p publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Only once the package is out, so a failed run leaves no tag behind and can be run again.
      - name: Tag the release
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "@fionapreroll/p2p ${TAG#p2p-v}"
          git push origin "$TAG"
