name: Android

# Builds the Android app (Capacitor) as an installable debug APK, on every push to main and every
# pull request, or by hand from the Actions tab. The APK is kept as the run's artifact; from main,
# it also goes to the release "Spark Hunt for Android", at a download link that never changes:
# https://github.com/FionaPreroll/vibe-p2pgame/releases/latest/download/spark-hunt.apk
# Beside it, version.json names the build, for the app's in-app updates.

on:
  push:
    branches: [main]
    # A game version (see "Changelog and game versions" in the README): its APK as a release too.
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: pnpm install --frozen-lockfile
      - run: pnpm android:sync
      - name: Build the APK
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        # The game's version, the build number and the commit, as Android shows the app's version.
        run: |
          VERSION_NAME="$(node -p "require('../package.json').version")-${GITHUB_RUN_NUMBER}-${GITHUB_SHA::7}" \
            ./gradlew assembleDebug --no-daemon
      # The Java unit tests (UpdateRules, NearbyRules), with JaCoCo's coverage of all the app's and
      # the Bluetooth library's Java, plugins included, for Codecov.
      - name: Test the Java, with coverage
        working-directory: android
        run: ./gradlew :app:createDebugUnitTestCoverageReport :fionapreroll-p2p-nearby:createDebugUnitTestCoverageReport --no-daemon
      - name: List the coverage reports
        run: find android/app/build/reports/coverage packages/p2p-nearby/android/build/reports/coverage -name '*.xml'
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: android
          # Only the files named: a search would add the other reports to this flag.
          disable_search: true
          files: android/app/build/reports/coverage/test/debug/report.xml,packages/p2p-nearby/android/build/reports/coverage/test/debug/report.xml
          fail_ci_if_error: true
      - run: mv android/app/build/outputs/apk/debug/app-debug.apk spark-hunt.apk
      - uses: actions/upload-artifact@v4
        with:
          name: spark-hunt-apk
          path: spark-hunt.apk
          retention-days: 30
          if-no-files-found: error

  release:
    # Builds of main only: pull requests and hand-started runs on other branches publish nothing.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: android-release
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: android-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: spark-hunt-apk
      - name: Skip if main has moved on
        id: current
        run: |
          head=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main is at $head now; its own run publishes that build instead."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the release
        if: steps.current.outputs.publish == 'true'
        run: |
          cat > notes.md <<NOTES
          The newest build of Spark Hunt for Android, from commit ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}). This release is replaced with every change to \`main\`.

          **Installing:** download \`spark-hunt.apk\` below and open it on the phone; Android asks once to allow installing apps from that source. A newer APK installs over an older one and keeps the game's settings.

          **Before going out:** start the app once with internet, so that Google's QR scanner can download its module.

          This is a debug build, signed with the project's debug key: for testing and playing with friends, not for the Play Store.
          NOTES
          # What the app compares with its own build number to find updates (src/updates.ts).
          printf '{"build":%s,"commit":"%s","size":%s}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_SHA" "$(stat -c %s spark-hunt.apk)" > version.json
          # The tag follows main: it always names the commit of the APK in the release.
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" spark-hunt.apk version.json --clobber
            gh release edit "$TAG" --title "Spark Hunt for Android" --notes-file notes.md --latest
          else
            gh release create "$TAG" spark-hunt.apk version.json --title "Spark Hunt for Android" --notes-file notes.md --latest
          fi

  version-release:
    # A game version, tagged vX.Y.Z: its APK as a release of its own, "Spark Hunt X.Y.Z", with the
    # version's changelog. It is never marked latest: the app's updates follow the release
    # "Spark Hunt for Android" above, whose address must keep naming the newest build of main.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: spark-hunt-apk
      - name: Publish the release
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$(node -p "require('./package.json').version")" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json"
            exit 1
          fi
          # The version's section of the changelog, without its heading.
          awk -v heading="## [$version] - " '
            index($0, heading) == 1 { on = 1; next }
            on && (/^## / || /^\[/) { exit }
            on { print }
          ' CHANGELOG.md > changes.md
          if ! grep -q '[^[:space:]]' changes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          {
            echo "Spark Hunt $version for Android, from commit ${GITHUB_SHA::7} (build ${GITHUB_RUN_NUMBER}). The newest build is always in the release _Spark Hunt for Android_; the website is always the newest."
            echo
            echo "**Installing:** download \`spark-hunt-$version.apk\` below and open it on the phone; Android asks once to allow installing apps from that source. A newer APK installs over an older one and keeps the game's settings. This is a debug build, signed with the project's debug key."
            cat changes.md
          } > notes.md
          mv spark-hunt.apk "spark-hunt-$version.apk"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "spark-hunt-$version.apk" --clobber
            gh release edit "$GITHUB_REF_NAME" --title "Spark Hunt $version" --notes-file notes.md --latest=false
          else
            gh release create "$GITHUB_REF_NAME" "spark-hunt-$version.apk" --title "Spark Hunt $version" --notes-file notes.md --latest=false
          fi
